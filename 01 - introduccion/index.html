 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduccion a CSS</title>
</head>
<body>
<!-- 1. CSS dentro del elemento <style>... </style> -->
        <style>

         h1 {
            color: rgb(206, 3, 196);
            font-size: 48px  
         }  

        </style>

       <h1>Introduccion a CSS</h1>  

       <!-- 2.Escribimos css en la linea. Dentro de la etiqueta de apertura de un elemento de HTML -->

          <P style="color: rgb(105, 83, 227); font-size: 48 px;">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua</P>
      
           <!--3. Escribimos CSS en un documento externo y lo llamamos a traves de el elemento link -->

           <h2>CSS externo</h2>
           <link rel="stylesheet" href="./style.css">

</body>
</html>
